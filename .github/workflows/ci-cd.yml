name: CI/CD

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate routes, typecheck & build SPA
        run: |
          bun run generate-routes
          bun run typecheck
          bun run build

  test-backend:
    name: Go Vet, Race Tests & Deploy Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./cmd/... ./internal/...

      - name: Run Go race tests
        run: go test -race -v ./cmd/... ./internal/...

      - name: Verify static server & agent builds
        run: |
          CGO_ENABLED=0 go build -trimpath -tags netgo,osusergo -ldflags="-s -w" -o /tmp/server ./cmd/server
          CGO_ENABLED=0 go build -trimpath -tags netgo,osusergo -ldflags="-s -w" -o /tmp/runway-agent ./cmd/agent

      - name: Lint deploy scripts & Docker Compose manifests
        run: |
          bash -n scripts/deploy.sh scripts/release.sh scripts/install-agent.sh
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.docker.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.docker.yml config --quiet

  release-agent:
    name: Build & Publish Runway Agent Binaries
    needs: [test-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build cross-platform runway-agent archives
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          VER_NOV="${VERSION#v}"
          mkdir -p dist

          build_target() {
            local os="$1" arch="$2"
            local out_dir="dist/stage_${os}_${arch}"
            local bin_name="runway-agent"
            [[ "${os}" == "windows" ]] && bin_name="runway-agent.exe"
            mkdir -p "${out_dir}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -trimpath -tags netgo,osusergo \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "${out_dir}/${bin_name}" ./cmd/agent

            if [[ "${os}" == "windows" ]]; then
              (cd "${out_dir}" && zip -q "../runway-agent_${VER_NOV}_${os}_${arch}.zip" "${bin_name}")
            else
              tar -C "${out_dir}" -czf "dist/runway-agent_${VER_NOV}_${os}_${arch}.tar.gz" "${bin_name}"
            fi
            rm -rf "${out_dir}"
          }

          build_target linux amd64
          build_target linux arm64
          build_target darwin amd64
          build_target darwin arm64
          build_target windows amd64
          build_target windows arm64

          (cd dist && sha256sum runway-agent_* > checksums.txt)
          ls -lh dist/

      - name: Upload agent build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: runway-agent-binaries
          path: dist/*

      - name: Publish agent binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --title "Runway ${TAG}" --generate-notes
          fi

  docker:
    name: Build & Publish Container Image
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  docker-runner:
    name: Build & Publish Runner Container Image
    needs: [test-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract runner image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-runner
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push runner Docker image
        uses: docker/build-push-action@v7
        with:
          context: runner
          file: runner/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max
          provenance: mode=max
          sbom: true
