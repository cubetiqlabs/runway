app:
  name: runway
  environment: development # development | production

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s
  body_limit_bytes: 2097152
  allowed_origins: []

database:
  url: postgres://runway:runway_dev_password@localhost:5432/runway?sslmode=disable
  max_conns: 20
  min_conns: 2
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m

eventstore:
  driver: postgres # postgres | clickhouse | disabled
  postgres_url: "" # optional separate PG DSN; defaults to database.url
  clickhouse_url: "" # e.g. http://localhost:8123
  clickhouse_database: runway
  clickhouse_username: default
  clickhouse_password: ""
  batch_size: 256
  flush_interval: 500ms
  buffer_size: 8192
  retention_days: 90

github:
  app_id: 0
  app_slug: runway
  webhook_secret: ""
  private_key_path: ""
  private_key_pem: ""
  api_base_url: https://api.github.com

security:
  session_secret: replace-with-at-least-32-character-random-secret
  encryption_key: replace-with-at-least-32-character-random-key
  session_ttl: 24h
  cookie_secure: false
  cookie_same_site: Lax
  login_rate_max: 10
  webhook_rate_max: 120

admin:
  email: admin@runway.local
  password: RunwayAdmin123!
  name: Runway Admin

moderation:
  default_action: allow # allow | require_approval | deny

orchestrator:
  provider: simulated # simulated | docker
  docker_socket: /var/run/docker.sock
  default_image: ghcr.io/actions/actions-runner:latest
  worker_count: 4
  queue_size: 128
  reconcile_interval: 30s
  provision_timeout: 3m
  stale_heartbeat_ttl: 5m
  cache_enabled: true
  cache_max_gb: 20
  prewarm_images: true

logging:
  level: info
  format: console # console | json
