# Overlay for provisioning ephemeral Docker runner containers securely via Docker Socket Proxy,
# with per-job isolated Docker-in-Docker (DinD) sidecars and automatic gVisor (runsc) sandboxing
# so concurrent workflow jobs and services (PostgreSQL/Redis/ports) never collide:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.docker.yml up -d --wait

networks:
  docker-proxy-net:
    driver: bridge

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: runway-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      VERSION: "1"
      VOLUMES: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  runway:
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    networks:
      - default
      - docker-proxy-net
    environment:
      RUNWAY_ORCHESTRATOR_DOCKER_SOCKET: ${DOCKER_PROXY_URL:-tcp://docker-proxy:2375}
      RUNWAY_ORCHESTRATOR_SANDBOX_RUNTIME: ${RUNWAY_ORCHESTRATOR_SANDBOX_RUNTIME:-auto}
      RUNWAY_ORCHESTRATOR_RUNNER_ISOLATED_DIND: ${RUNWAY_ORCHESTRATOR_RUNNER_ISOLATED_DIND:-true}
      RUNWAY_ORCHESTRATOR_DIND_IMAGE: ${RUNWAY_DIND_IMAGE:-docker:dind}
      RUNWAY_ORCHESTRATOR_RUNNER_DNS: ${RUNWAY_ORCHESTRATOR_RUNNER_DNS:-}
